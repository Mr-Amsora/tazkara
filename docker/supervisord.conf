[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid


[program:postgres]
command=/usr/local/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
user=rabbitmq
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/rabbitmq",RABBITMQ_NODENAME="rabbit@localhost",RABBITMQ_NODE_IP_ADDRESS="127.0.0.1",RABBITMQ_MNESIA_BASE="/data/rabbitmq/mnesia"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


[program:identity]
command=/bin/bash -c 'until PGPASSWORD="%(ENV_DB_PASSWORD)s" /usr/bin/psql -h 127.0.0.1 -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done; exec java -jar /app/identity-service.jar'
user=tazkara
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


[program:event]
command=/bin/bash -c 'until PGPASSWORD="%(ENV_DB_PASSWORD)s" /usr/bin/psql -h 127.0.0.1 -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done; until bash -c "echo > /dev/tcp/127.0.0.1/5672" 2>/dev/null; do sleep 2; done; exec java -jar /app/event-service.jar'
user=tazkara
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


[program:booking]
command=/bin/bash -c 'until PGPASSWORD="%(ENV_DB_PASSWORD)s" /usr/bin/psql -h 127.0.0.1 -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 2; done; until bash -c "echo > /dev/tcp/127.0.0.1/5672" 2>/dev/null; do sleep 2; done; exec java -jar /app/booking-service.jar'
user=tazkara
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


[program:gateway]
command=java -jar /app/api-gateway.jar
user=tazkara
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
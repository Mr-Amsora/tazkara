server.port=8083
spring.application.name=booking-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.internal.api-key=${INTERNAL_API_KEY}

app.booking.hold-minutes=10
app.booking.expiry-job-interval-ms=30000
app.booking.max-tickets-per-event=6

app.event-service.url=${EVENT_SERVICE_URL:http://localhost:8082}
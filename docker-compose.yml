services:
  tazkara:
    build: .
    container_name: tazkara
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:15672:15672"

    environment:
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"

    volumes:
      - tazkara-data:/data

    stop_grace_period: 60s

    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

volumes:
  tazkara-data:

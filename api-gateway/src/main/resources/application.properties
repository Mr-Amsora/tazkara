server.port=8080
spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s

spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=${IDENTITY_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=booking-organizer
spring.cloud.gateway.server.webflux.routes[1].uri=${BOOKING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[1].order=0
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/organizer/events/*/bookings/**,/api/organizer/events/*/sales

spring.cloud.gateway.server.webflux.routes[2].id=event-service
spring.cloud.gateway.server.webflux.routes[2].uri=${EVENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].order=1
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/events/**,/api/organizer/events/**

spring.cloud.gateway.server.webflux.routes[3].id=booking-attendee
spring.cloud.gateway.server.webflux.routes[3].uri=${BOOKING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/attendee/**